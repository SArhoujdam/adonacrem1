<!DOCTYPE html>

  <head>

      name="description"
      content="Découvrez tous les produits Adonacrem Beauty : soins, parfums, hygiène et beauté."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="produits">
    <header class="topbar">
      <div class="container nav">
        <a href="index.html" class="brand brand-logo-wrap" aria-label="Accueil" onclick="window.location.reload();">
          <img src="assets/logo-cremzin.svg" alt="Logo Adonacrem" class="brand-logo" />
        </a>
        <nav class="menu">
          <a href="index.html">Accueil</a>
          <a href="produits.html">Produits</a>
          <a href="promos.html">Promos</a>
          <a href="contact.html">Contact</a>
        </nav>
        <a class="btn btn-primary" href="https://wa.me/212787324470?text=Bonjour%2C%20je%20souhaite%20une%20commande." target="_blank" rel="noreferrer">Commander</a>
      </div>
    </header>

    <main>
      <section class="products" id="produits">
        <div class="container section-head">
          <p class="eyebrow">Nos best sellers</p>
          <h2>Produits cosmétique</h2>
        </div>
        <div class="container product-toolbar">
          <label class="search-field" for="productSearch">
            <span class="search-label">Rechercher un produit</span>
            <input
              id="productSearch"
              type="search"
              placeholder="Cherchez par nom ou catégorie..."
              aria-label="Rechercher un produit"
            />
          </label>
        </div>
        <div class="container product-results">
          <p id="productResultsCount" aria-live="polite"></p>
        </div>
        <div class="container product-grid" id="productGrid"></div>
      </section>
    </main>

    <footer class="footer" id="contact">
      <div class="container footer-grid">
        <div>
          <div class="brand footer-brand brand-logo-wrap">
            <a href="index.html" aria-label="Accueil" onclick="window.location.reload();">
              <img src="assets/logo-cremzin.svg" alt="Logo Adonacrem" class="brand-logo" />
            </a>
          </div>
          <p>Votre boutique beauté en ligne pour des produits essentiels au quotidien.</p>
        </div>
        <div>
          <h4>Contact</h4>
          <ul>
            <li>WhatsApp : +212 787 324 470</li>
            <li>Email : hello@adonacrembeauty.fr</li>
            <li>Horaires : Lun-Sam 9h-19h</li>
          </ul>
